name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Debug mongo
        run: |
          docker run -d --name m mongo:8.0 --replSet docker-rs
          sleep 5; docker ps -a --format '{{.Image}} {{.Status}}'
          docker exec m mongosh --quiet --eval 'printjson(rs.initiate())' || true
          sleep 8; docker ps -a --format '{{.Image}} {{.Status}}'
          docker inspect m --format 'exit={{.State.ExitCode}} oom={{.State.OOMKilled}}'
          docker logs m 2>&1 | grep -E '"s":"(F|E)"' | tail -10
          docker logs m 2>&1 | tail -5
          exit 1

      - name: Build and run tests
        run: ./mvnw -B -ntp verify
