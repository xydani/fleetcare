name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Debug mongo
        run: |
          uname -r
          for t in 8.0 8.2 7.0; do docker run -d --name m$t mongo:$t --replSet docker-rs >/dev/null 2>&1; done
          sleep 10; docker ps -a --format '{{.Image}} {{.Status}}'
          for t in 8.0 8.2; do docker exec m$t mongod --version | head -1; done
          exit 1

      - name: Build and run tests
        run: ./mvnw -B -ntp verify
