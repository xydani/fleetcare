name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and run tests
        run: ./mvnw -B -ntp verify

      - name: Coverage summary
        if: always()
        run: |
          csv=coverage-report/target/site/jacoco-aggregate/jacoco.csv
          [ -f "$csv" ] || exit 0
          {
            echo "### Test coverage"
            echo "| Module | Lines | Branches |"
            echo "|---|---|---|"
            awk -F, 'NR > 1 { m = $1; sub(/.*\//, "", m); lm[m] += $8; lc[m] += $9; bm[m] += $6; bc[m] += $7;
                              tlm += $8; tlc += $9; tbm += $6; tbc += $7 }
                     END { for (m in lm) printf "| %s | %.1f%% | %.1f%% |\n", m, 100*lc[m]/(lm[m]+lc[m]), 100*bc[m]/(bm[m]+bc[m]);
                           printf "| **Total** | **%.1f%%** | **%.1f%%** |\n", 100*tlc/(tlm+tlc), 100*tbc/(tbm+tbc) }' "$csv"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage-report/target/site/jacoco-aggregate/
          if-no-files-found: ignore

  compose:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Start the whole system
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Call each service through the gateway
        run: |
          curl -fsS http://localhost:8080/api/vehicles/1
          curl -fsS "http://localhost:8080/api/reports/brands/average-cost?minInterventions=1"
          curl -fsS http://localhost:8080/api/notifications/unread-count
          curl -fsS -o /dev/null http://localhost:8080/swagger-ui/index.html

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail 100

      - name: Stop
        if: always()
        run: docker compose down --volumes
