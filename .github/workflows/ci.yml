name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Debug mongo
        run: |
          docker run -d --name mdb -p 27017 mongo:8.0
          sleep 6; docker ps -a --format '{{.Image}} {{.Status}}'
          docker inspect mdb --format 'exit={{.State.ExitCode}} oom={{.State.OOMKilled}}'
          docker logs mdb 2>&1 | grep -E '"s":"(F|E|W)"' | cut -c1-400 | tail -10
          docker logs mdb 2>&1 | tail -3 | cut -c1-400
          exit 1

      - name: Build and run tests
        run: ./mvnw -B -ntp verify
