name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Debug mongo
        run: |
          uname -a; nproc; free -m; docker version --format '{{.Server.Version}}'
          grep -o -m1 -w avx2 /proc/cpuinfo || echo "no avx2"
          docker run -d --name m8 mongo:8 --replSet docker-rs
          sleep 8; docker ps -a; docker inspect m8 --format '{{.State.ExitCode}} {{.State.OOMKilled}} {{.State.Error}}'
          docker logs m8 2>&1 | tail -40
          docker run -d --name m7 mongo:7 --replSet docker-rs; sleep 8; docker ps -a --filter name=m7
          exit 1

      - name: Build and run tests
        run: ./mvnw -B -ntp verify
