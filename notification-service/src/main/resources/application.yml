spring:
  application:
    name: notification-service
  mongodb:
    host: ${MONGO_HOST:localhost}
    port: ${MONGO_PORT:27017}
    database: notifications
    username: ${MONGO_USER:fleetcare}
    password: ${MONGO_PASSWORD:fleetcare}
    authentication-database: admin
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info

fleetcare:
  reminders:
    # every day at 07:00; "-" disables the job (the manual endpoint keeps working)
    cron: ${REMINDERS_CRON:0 0 7 * * *}
    days-ahead: 30
  clients:
    vehicle-service-url: ${VEHICLE_SERVICE_URL:http://localhost:8081}
